[SERVICE]
; Intervalo de execucao da thread em milissegundos
PollingIntervalMs=10000
; Nivel de log: DEBUG, INFO, WARN, ERROR
LogLevel=INFO

[HTTP]
; Porta TCP para o servidor HTTP
Port=8080
; Endereco de bind (0.0.0.0 = todas as interfaces)
BindAddress=0.0.0.0
