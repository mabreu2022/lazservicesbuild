[SERVICE]
; Intervalo de execucao da thread em milissegundos
PollingIntervalMs=1000
; Nivel de log: DEBUG, INFO, WARN, ERROR
LogLevel=INFO

[QUEUE]
; Quantidade de mensagens processadas por lote
BatchSize=100
; Limite de workers concorrentes
MaxWorkers=4
