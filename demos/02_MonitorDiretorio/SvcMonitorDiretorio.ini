; ===========================================================================
; Arquivo de Configuracao do Servico: SvcMonitorDiretorio
; Gerado pela Fabrica de Servicos Cross-Platform (Lazarus / Free Pascal)
; ===========================================================================

[SERVICE]
; Intervalo de execucao da thread em milissegundos
PollingIntervalMs=3000
; Nivel de log: DEBUG, INFO, WARN, ERROR
LogLevel=INFO

[MONITOR]
; Pasta monitorada para entrada de arquivos
InboxPath=./inbox
; Pasta de destino de arquivos processados
OutboxPath=./outbox
; Pasta para arquivos com falha
ErrorPath=./error
