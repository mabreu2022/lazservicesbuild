[SERVICE]
; Intervalo de execucao da thread em milissegundos
PollingIntervalMs=60000
; Nivel de log: DEBUG, INFO, WARN, ERROR
LogLevel=INFO

[SCHEDULE]
; Horario diario de execucao (formato hh:nn:ss)
DailyExecutionTime=02:00:00
; Pasta de destino para o backup/tarefa
TargetDir=./backups
